name: Docker check

# The Docker check of tabernetes/docs/docker-node-check.md on a GitHub runner:
# a Docker node with the node image of this commit joins the page in headless
# Chromium, then the steps wasi-* run the tests of section 10.2 of
# tabernetes/docs/wasi-sockets.md on runwasi. The job fails when a step prints
# FAIL. On main, the job also pushes the test images of
# tabernetes/wasm-images/images.txt (kind "component") to ghcr.io.
on:
  pull_request:
    paths:
      - tabernetes/node/**
      - tabernetes/k8s/tabernetes/addons/**
      - tabernetes/k8s/tabernetes/tabnode_wasi*.go
      - tabernetes/web/src/wasi*.js
      - tabernetes/web/src/sockets.js
      - tabernetes/web/src/files.js
      - tabernetes/web/src/http.js
      - tabernetes/web/src/transpile.worker.js
      - tabernetes/docs/docker-node-check/**
      - tabernetes/wasm-images/**
      - tabernetes/mise.toml
      - .github/workflows/docker-check.yaml

  push:
    branches:
      - main
    paths:
      - tabernetes/wasm-images/**
      - .github/workflows/docker-check.yaml

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Docker node
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      OUT: ${{ github.workspace }}/out
      IMAGE: tabernetes-node:check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise installs Go, Node.js and Rust with wasm32-wasip2 (tabernetes/mise.toml).
      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          working_directory: tabernetes

      # Same key as ci.yaml and pages.yaml.
      - name: Cache tabernetes
        id: cache-tabernetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tabernetes/.build/assets/tabernetes.wasm.zst
            tabernetes/.build/assets/THIRD_PARTY_LICENSES.go.json
            tabernetes/.build/wasm_exec.js
          key: tabernetes-${{ hashFiles('tabernetes/mise.toml', 'tabernetes/k8s/**', 'tabernetes/site/third-party.mjs') }}

      - name: Build tabernetes
        if: steps.cache-tabernetes.outputs.cache-hit != 'true'
        working-directory: tabernetes
        run: mise run wasm

      # The page with the OCI mirror (wasm-images/build.sh), which has the
      # test images for the step wasi-images.
      - name: Build page
        working-directory: tabernetes
        run: mise run site

      # The node image of this commit, as tabernetes-image.yaml builds it.
      - name: Build node image
        working-directory: tabernetes
        run: |
          docker build --build-arg KUBERNETES_VERSION="$(sed -n 's/^KUBERNETES_VERSION = "\(.*\)"$/\1/p' mise.toml)" \
            --build-context addons=k8s/tabernetes/addons -t "${IMAGE}" node

      # Playwright from the lockfile of the browser of phase 0.
      - name: Install Playwright
        working-directory: tabernetes/docs/wasi-sockets-poc/browser
        run: |
          npm ci --silent
          npx playwright install --with-deps chromium
          # browser.mjs and tab.mjs load Playwright with require().
          echo "NODE_PATH=${PWD}/node_modules" >>"${GITHUB_ENV}"

      - name: Host
        run: |
          uname -r
          docker info -f 'cgroups v{{.CgroupVersion}}, Docker {{.ServerVersion}}'
          command -v ctr jq
          # Ubuntu 23.10 and later: AppArmor denies the user namespace of
          # the node agent ("fork/exec /proc/self/exe: permission denied").
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # flannel and the NetworkPolicy between pods of the node need
          # br_netfilter; the runner does not load it.
          sudo modprobe br_netfilter

      # The processes stay for the next steps of the job.
      - name: Start the page
        working-directory: tabernetes
        run: |
          nohup python3 -m http.server -d .build/site 8080 >"${RUNNER_TEMP}/http.log" 2>&1 &
          nohup node docs/docker-node-check/browser.mjs >"${RUNNER_TEMP}/browser.log" 2>&1 &
          for _ in $(seq 120); do
            grep -q '^ready' "${RUNNER_TEMP}/browser.log" && exit 0
            if ! pgrep -f browser.mjs >/dev/null; then break; fi
            sleep 5
          done
          cat "${RUNNER_TEMP}/browser.log"
          exit 1

      - name: Join the Docker node
        working-directory: tabernetes
        run: |
          docs/docker-node-check/check.sh images join
          ! grep -q '^FAIL' "${OUT}/summary.txt"

      - name: WASI steps
        working-directory: tabernetes
        run: |
          docs/docker-node-check/check.sh wasi-images wasi-command wasi-proxy wasi-sockets wasi-udp
          ! grep -q '^FAIL' "${OUT}/summary.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo '## Docker check'
            echo '```text'
            cat "${OUT}/summary.txt" 2>/dev/null || echo "no summary"
            echo '```'
            for f in "${OUT}"/wasi-*.txt; do
              [ -e "${f}" ] || continue
              echo "<details><summary>$(basename "${f}")</summary>"
              echo
              echo '```text'
              cat "${f}"
              echo '```'
              echo '</details>'
            done
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Logs
        if: failure()
        run: |
          cat "${RUNNER_TEMP}/browser.log" "${OUT}"/*.txt 2>/dev/null || true
          docker logs tabernetes-node-1 2>&1 | tail -100 || true

  # The test images on ghcr.io (section 10.1 of tabernetes/docs/wasi-sockets.md).
  # images.txt names them ghcr.io/se-wo/..., so a fork does not push them.
  push-images:
    name: Push test images
    if: github.event_name == 'push' && github.repository == 'se-wo/tabernetes'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          working_directory: tabernetes

      - name: Build and push
        working-directory: tabernetes
        env:
          PUSH: "1"
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: wasm-images/build.sh "${RUNNER_TEMP}/oci"
