name: CI

on:
  # All pull requests, also the ones stacked on another pull request branch.
  # main is built, tested and published by pages.yaml.
  pull_request:

  workflow_dispatch:

permissions: {}

# One run per branch at a time, so pull requests do not queue behind each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tabernetes/mise.toml inherits the root mise.toml: node and go in one go.
      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          working_directory: tabernetes

      # Same key as pages.yaml: pull requests reuse the binary of main.
      - name: Cache tabernetes
        id: cache-tabernetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tabernetes/.build/assets/tabernetes.wasm.zst
            tabernetes/.build/assets/THIRD_PARTY_LICENSES.go.json
            tabernetes/.build/wasm_exec.js
          key: tabernetes-${{ hashFiles('tabernetes/mise.toml', 'tabernetes/k8s/**', 'tabernetes/site/third-party.mjs') }}

      - name: Build tabernetes
        if: steps.cache-tabernetes.outputs.cache-hit != 'true'
        working-directory: tabernetes
        run: mise run wasm

      # Only when the wasm was rebuilt: the cache key covers everything the
      # tests check (tabernetes/k8s/**, tabernetes/mise.toml).
      - name: Test tabernetes
        if: steps.cache-tabernetes.outputs.cache-hit != 'true'
        working-directory: tabernetes
        run: mise run test

      - name: Build page
        working-directory: tabernetes
        run: mise run site

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MULTI_STATUS: false
          LINTER_RULES_PATH: .github/linters
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          SAVE_SUPER_LINTER_SUMMARY: true
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_HTML: true
          VALIDATE_JSON: true
          VALIDATE_NATURAL_LANGUAGE: true
          VALIDATE_MARKDOWN: true
          VALIDATE_RENOVATE: true
          VALIDATE_SHELL_SHFMT: true
          # Templates of the page (tabernetes/site/build.mjs), not standalone HTML documents.
          FILTER_REGEX_EXCLUDE: ^tabernetes/site/.*[.]html$
          STRIP_DEFAULT_WORKSPACE_FOR_REGEX: true

  test-web:
    name: Test web
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          working_directory: tabernetes

      - name: Unit tests of the terminal
        working-directory: tabernetes
        run: mise run test-web

  # The page in headless Chromium, on the tab node and on a node worker
  # (tabernetes/web/test/README.md).
  e2e:
    name: End-to-end
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          working_directory: tabernetes

      # The binary that the job Build put into the cache.
      - name: Restore tabernetes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tabernetes/.build/assets/tabernetes.wasm.zst
            tabernetes/.build/assets/THIRD_PARTY_LICENSES.go.json
            tabernetes/.build/wasm_exec.js
          key: tabernetes-${{ hashFiles('tabernetes/mise.toml', 'tabernetes/k8s/**', 'tabernetes/site/third-party.mjs') }}
          fail-on-cache-miss: true

      - name: Build page
        working-directory: tabernetes
        run: mise run site

      - name: Install Playwright
        working-directory: tabernetes/web/test/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          # browser.mjs and tab.mjs load Playwright with require().
          echo "NODE_PATH=${PWD}/node_modules" >>"${GITHUB_ENV}"

      - name: End-to-end tests
        working-directory: tabernetes
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
        run: node web/test/e2e/run.mjs

      - name: Logs
        if: failure()
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
        run: |
          for f in browser-console.log control-plane.log terminal.txt; do
            echo "::group::${f}"
            tail -n 300 "${E2E_OUT}/${f}" 2>/dev/null || echo "no ${f}"
            echo "::endgroup::"
          done
