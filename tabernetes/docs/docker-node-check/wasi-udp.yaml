# Objects of the step wasi-udp (wasi-udp.sh): UDP of phase 4 of
# ../wasi-sockets.md on runwasi. The pods of phase 4 run on node-1 with the
# test images of the step wasi-images; the pods of phase 5 (at the end) run
# on node-1 and on the tab node. The UDP modes of wasi-test-echo are in
# wasm-images/rust/echo/src/main.rs. The client containers wait with DELAY_MS
# until their servers listen and their names resolve.
---
# UD2, UD7, UD15: the UDP echo server on 0.0.0.0:7. UD13: the container
# "self" sends to the Service of its own pod, with the full name: the short
# name is the name of the pod, which /etc/hosts gives the pod IP. "self" runs
# for 60 seconds: a container that exits makes the pod not ready, and a
# Service without ready endpoints rejects the datagrams.
apiVersion: v1
kind: Pod
metadata: {name: wasi-echo-udp, labels: {wasi-check: udp, app: wasi-echo-udp}}
spec:
  runtimeClassName: wasmtime
  nodeSelector: {kubernetes.io/hostname: node-1}
  restartPolicy: Never
  containers:
    - name: c
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env: [{name: PROTO, value: udp}]
    - name: self
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-client}
        - {name: CONNECT, value: "wasi-echo-udp.default.svc.cluster.local:7"}
        - {name: CONNECTED, value: "1"}
        - {name: LINE, value: self}
        - {name: COUNT, value: "30"}
        - {name: INTERVAL_MS, value: "2000"}
        - {name: DELAY_MS, value: "10000"}
---
apiVersion: v1
kind: Service
metadata: {name: wasi-echo-udp}
spec:
  selector: {app: wasi-echo-udp}
  ports: [{port: 7, protocol: UDP}]
---
# Fact 11 of W4.5a: a second ClusterIP with the same endpoint.
apiVersion: v1
kind: Service
metadata: {name: wasi-echo-udp2}
spec:
  selector: {app: wasi-echo-udp}
  ports: [{port: 7, protocol: UDP}]
---
# The name wasi-echo-udp-pod resolves to the pod IP (UD8, UD9).
apiVersion: v1
kind: Service
metadata: {name: wasi-echo-udp-pod}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: wasi-echo-udp}
  ports: [{port: 7, protocol: UDP}]
---
# UD10, UD11: a Service without endpoints.
apiVersion: v1
kind: Service
metadata: {name: wasi-udp-none}
spec:
  selector: {app: wasi-udp-none}
  ports: [{port: 7, protocol: UDP}]
---
# UD20: the echo server on 127.0.0.1:7 and a client in the same pod. UD21:
# the name wasi-udp-lo resolves to the pod IP, which has no socket on port 7.
# The pod is not ready after the client exits, so the headless Service
# publishes the address of a pod that is not ready.
apiVersion: v1
kind: Pod
metadata: {name: wasi-udp-lo, labels: {wasi-check: udp, app: wasi-udp-lo}}
spec:
  runtimeClassName: wasmtime
  nodeSelector: {kubernetes.io/hostname: node-1}
  restartPolicy: Never
  containers:
    - name: c
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: PROTO, value: udp}
        - {name: ADDR, value: "127.0.0.1:7"}
    - name: client
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-client}
        - {name: CONNECT, value: "127.0.0.1:7"}
        - {name: LINE, value: lo}
        - {name: DELAY_MS, value: "5000"}
---
apiVersion: v1
kind: Service
metadata: {name: wasi-udp-lo}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: wasi-udp-lo}
  ports: [{port: 7, protocol: UDP}]
---
# The clients in another pod. Each container is one component with its own
# socket. A connected client sends 3 datagrams: the error of the first one
# shows in the second one.
apiVersion: v1
kind: Pod
metadata: {name: wasi-udp-clients, labels: {wasi-check: udp}}
spec:
  runtimeClassName: wasmtime
  nodeSelector: {kubernetes.io/hostname: node-1}
  restartPolicy: Never
  containers:
    # UD2, UD7, UD15: connected and not connected, through the Service.
    - name: svc
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-client}
        - {name: CONNECT, value: "wasi-echo-udp:7"}
        - {name: CONNECTED, value: "1"}
        - {name: COUNT, value: "2"}
        - {name: INTERVAL_MS, value: "500"}
        - {name: LINE, value: svc}
        - {name: DELAY_MS, value: "10000"}
    - name: unc
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-client}
        - {name: CONNECT, value: "wasi-echo-udp:7"}
        - {name: LINE, value: unc}
        - {name: DELAY_MS, value: "10000"}
    # UD8, UD9: the pod IP of the echo pod, port 9 without a socket. Fact 3:
    # the same without connect.
    - name: noport
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-client}
        - {name: CONNECT, value: "wasi-echo-udp-pod:9"}
        - {name: CONNECTED, value: "1"}
        - {name: COUNT, value: "3"}
        - {name: INTERVAL_MS, value: "500"}
        - {name: WAIT_MS, value: "1000"}
        - {name: DELAY_MS, value: "10000"}
    - name: noport-unc
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-client}
        - {name: CONNECT, value: "wasi-echo-udp-pod:9"}
        - {name: COUNT, value: "3"}
        - {name: INTERVAL_MS, value: "500"}
        - {name: WAIT_MS, value: "1000"}
        - {name: DELAY_MS, value: "10000"}
    # UD10, UD11: a Service without endpoints.
    - name: noep
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-client}
        - {name: CONNECT, value: "wasi-udp-none:7"}
        - {name: CONNECTED, value: "1"}
        - {name: COUNT, value: "3"}
        - {name: INTERVAL_MS, value: "500"}
        - {name: WAIT_MS, value: "1000"}
        - {name: DELAY_MS, value: "10000"}
    # UD12: the ClusterIP of wasi-echo-udp with port 9, which no Service has.
    - name: nosvc
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-client}
        - {name: CONNECT, value: "wasi-echo-udp:9"}
        - {name: CONNECTED, value: "1"}
        - {name: COUNT, value: "3"}
        - {name: INTERVAL_MS, value: "500"}
        - {name: WAIT_MS, value: "1000"}
        - {name: DELAY_MS, value: "10000"}
    # UD21: the pod IP of wasi-udp-lo, where only 127.0.0.1:7 has a socket.
    - name: lo
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-client}
        - {name: CONNECT, value: "wasi-udp-lo:7"}
        - {name: CONNECTED, value: "1"}
        - {name: COUNT, value: "3"}
        - {name: INTERVAL_MS, value: "500"}
        - {name: WAIT_MS, value: "1000"}
        - {name: DELAY_MS, value: "10000"}
    # Fact 11: one socket sends to two ClusterIPs with the same endpoint.
    - name: clash
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-client}
        - {name: CONNECT, value: "wasi-echo-udp:7,wasi-echo-udp2:7"}
        - {name: COUNT, value: "2"}
        - {name: INTERVAL_MS, value: "500"}
        - {name: LINE, value: clash}
        - {name: DELAY_MS, value: "10000"}
---
# UD14 and the facts of rules 2 to 7 of section 8.3.3, the UDP options
# (TC22).
apiVersion: v1
kind: Pod
metadata: {name: wasi-udp-facts, labels: {wasi-check: udp}}
spec:
  runtimeClassName: wasmtime
  nodeSelector: {kubernetes.io/hostname: node-1}
  restartPolicy: Never
  containers:
    - name: errors
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-errors}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
    - name: options
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env: [{name: MODE, value: udp-options}]
---
# UD5, UD6: 1,000 datagrams of 1,024 bytes to a server that does not read
# until the flood is over.
apiVersion: v1
kind: Pod
metadata: {name: wasi-udp-queue, labels: {wasi-check: udp}}
spec:
  runtimeClassName: wasmtime
  nodeSelector: {kubernetes.io/hostname: node-1}
  restartPolicy: Never
  containers:
    - name: server
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-queue}
        - {name: ADDR, value: "0.0.0.0:7300"}
        - {name: READ_DELAY_MS, value: "8000"}
    - name: flood
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env:
        - {name: MODE, value: udp-flood}
        - {name: CONNECT, value: "127.0.0.1:7300"}
        - {name: DELAY_MS, value: "3000"}
---
# Fact 9: busybox nc -u.
apiVersion: v1
kind: Pod
metadata: {name: wasi-udp-client, labels: {wasi-check: udp}}
spec:
  nodeSelector: {kubernetes.io/hostname: node-1}
  containers:
    - {name: c, image: busybox, imagePullPolicy: IfNotPresent, command: [sleep, "86400"]}
---
# Phase 5, UDP between nodes (W5.3): the servers and the busybox clients.
# The pods with "tab" in the nodeSelector run on the tab node, the others
# on node-1. The clients of the echo image are in wasi-udp.sh: they get the
# IPs of these pods as literals. Each running component on the tab uses one
# Wasm memory (section 14 of ../wasi-sockets.md): two echo servers there,
# the other tab pods are busybox.
#
# ND3 to ND5, ND16, ND18: the UDP echo server on node-1 and its Service (the
# only endpoint is on node-1).
apiVersion: v1
kind: Pod
metadata: {name: wasi-nd-dock, labels: {wasi-check: udp, app: wasi-nd-dock}}
spec:
  runtimeClassName: wasmtime
  nodeSelector: {kubernetes.io/hostname: node-1}
  containers:
    - name: c
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env: [{name: PROTO, value: udp}]
---
apiVersion: v1
kind: Service
metadata: {name: wasi-nd-dock}
spec:
  selector: {app: wasi-nd-dock}
  ports: [{port: 7, protocol: UDP}]
---
# ND13 to ND15: the UDP echo server on the tab node and its Service (the
# only endpoint is on the tab node).
apiVersion: v1
kind: Pod
metadata: {name: wasi-nd-tab, labels: {wasi-check: udp, app: wasi-nd-tab}}
spec:
  runtimeClassName: wasmtime
  nodeSelector: {kubernetes.io/hostname: tab}
  containers:
    - name: c
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      env: [{name: PROTO, value: udp}]
---
apiVersion: v1
kind: Service
metadata: {name: wasi-nd-tab}
spec:
  selector: {app: wasi-nd-tab}
  ports: [{port: 7, protocol: UDP}]
---
# ND9: a UDP echo server on the tab node with a policy that denies all its
# ingress. The engine of the tab node decides.
apiVersion: v1
kind: Pod
metadata: {name: wasi-nd-in, labels: {wasi-check: udp, app: wasi-nd-in}}
spec:
  runtimeClassName: wasmtime
  nodeSelector: {kubernetes.io/hostname: tab}
  containers:
    - name: c
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      env: [{name: PROTO, value: udp}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: wasi-nd-in}
spec:
  podSelector: {matchLabels: {app: wasi-nd-in}}
  policyTypes: [Ingress]
---
# ND10, ND17: a UDP echo server on node-1 with a policy that permits only
# the tab pod wasi-nd-ok. kube-network-policies on node-1 (nfqueue)
# examines the datagrams of the transparent sockets of the agent (uid
# 65534); the second tab pod wasi-nd-bb gets no answer.
apiVersion: v1
kind: Pod
metadata: {name: wasi-nd-pol, labels: {wasi-check: udp, app: wasi-nd-pol}}
spec:
  runtimeClassName: wasmtime
  nodeSelector: {kubernetes.io/hostname: node-1}
  containers:
    - name: c
      image: ghcr.io/se-wo/tabernetes/wasi-test-echo:latest
      imagePullPolicy: Never
      env: [{name: PROTO, value: udp}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: wasi-nd-pol}
spec:
  podSelector: {matchLabels: {app: wasi-nd-pol}}
  policyTypes: [Ingress]
  ingress: [{from: [{podSelector: {matchLabels: {app: wasi-nd-ok}}}]}]
---
# The busybox clients on the tab node: wasi-nd-bb (nslookup, ping, nc -u;
# the second tab pod of ND17), wasi-nd-ok (the tab pod that the policy of
# ND10 permits) and wasi-nd-eg (ND6: a policy denies all its egress).
apiVersion: v1
kind: Pod
metadata: {name: wasi-nd-bb, labels: {wasi-check: udp, app: wasi-nd-bb}}
spec:
  nodeSelector: {kubernetes.io/hostname: tab}
  terminationGracePeriodSeconds: 1
  containers: [{name: c, image: busybox, command: [sleep, "86400"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: wasi-nd-ok, labels: {wasi-check: udp, app: wasi-nd-ok}}
spec:
  nodeSelector: {kubernetes.io/hostname: tab}
  terminationGracePeriodSeconds: 1
  containers: [{name: c, image: busybox, command: [sleep, "86400"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: wasi-nd-eg, labels: {wasi-check: udp, app: wasi-nd-eg}}
spec:
  nodeSelector: {kubernetes.io/hostname: tab}
  terminationGracePeriodSeconds: 1
  containers: [{name: c, image: busybox, command: [sleep, "86400"]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: wasi-nd-eg}
spec:
  podSelector: {matchLabels: {app: wasi-nd-eg}}
  policyTypes: [Egress]
