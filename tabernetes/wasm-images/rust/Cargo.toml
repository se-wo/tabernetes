# Rust test components of section 10.1 of ../../docs/wasi-sockets.md, from the
# components of phase 0 (../../docs/wasi-sockets-poc/components/).
# ../build.sh builds them for wasm32-wasip2: the kind "component" of
# ../images.txt.
[workspace]
members = ["both", "cmd", "cmdhttp", "core", "echo", "exitcode", "proxy", "wasi03"]
resolver = "2"

[profile.release]
opt-level = "s"
strip = true
